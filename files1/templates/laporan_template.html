<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Laporan Batik Aceh AI</title>
    <style>
        @page {
            size: A4;
            margin: 0;
            padding: 0;
            @bottom-center {
                content: "Batik Aceh AI - Sistem Pelestarian Budaya Berbasis Deep Learning";
                font-family: 'Helvetica', 'Arial', sans-serif;
                font-size: 9pt;
                color: #888;
                padding-bottom: 20px;
                border-top: 1px solid #E0E0E0;
            }
        }
        
        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #FFFFFF;
        }
        
        /* HEADER (Full Width, Gradation simulation using a rich color) */
        .header {
            background-color: #2E7D32; 
            width: 100%;
            padding: 40px 40px;
            color: white;
            border-bottom: 15px solid #D4A017; /* Emas */
        }
        
        .header h1 {
            margin: 0;
            font-size: 26pt;
            font-weight: bold;
            color: #FFFFFF;
            letter-spacing: 1px;
        }
        
        .header p {
            margin: 5px 0 0 0;
            font-size: 11pt;
            color: #E8F5E9;
        }
        
        .content {
            padding: 30px 40px;
        }
        
        .row {
            width: 100%;
            margin-bottom: 20px;
        }
        
        /* CARD: Gambar Batik */
        .img-card {
            width: 40%;
            float: left;
            padding: 10px;
            background: #FAFAFA;
            border-radius: 12px;
            border: 4px solid {{ motif_color }};
            text-align: center;
            margin-right: 5%;
        }
        
        .img-card img {
            width: 100%;
            border-radius: 8px;
        }
        
        /* CARD: Hasil Prediksi */
        .result-card {
            width: 50%;
            float: left;
            padding: 20px 0;
        }
        
        .result-title {
            font-size: 12pt;
            color: #777;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .result-motif {
            font-size: 28pt;
            font-weight: bold;
            color: {{ motif_color }};
            margin: 5px 0 20px 0;
        }
        
        /* Progress Bar (Confidence) */
        .progress-label {
            font-size: 11pt;
            font-weight: bold;
            color: #444;
            margin-bottom: 5px;
        }
        
        .progress-bar-container {
            width: 100%;
            background-color: #EEEEEE;
            border-radius: 8px;
            margin-bottom: 10px;
            height: 16px;
        }
        
        .progress-bar-fill {
            background-color: {{ conf_color }};
            width: {{ confidence }}%;
            height: 16px;
            border-radius: 8px;
        }
        
        /* Badge Status (Pill) */
        .status-badge {
            display: inline-block;
            background-color: {{ conf_color }};
            color: white;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11pt;
            margin-top: 15px;
        }
        
        .clear {
            clear: both;
        }
        
        /* Palet Warna Visual (Swatches) */
        .section-title {
            font-size: 14pt;
            font-weight: bold;
            color: #2E7D32;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #E8F5E9;
            padding-bottom: 5px;
        }
        
        .swatch-container {
            width: 100%;
            margin-top: 10px;
        }
        
        .swatch-box {
            float: left;
            width: 15%;
            margin-right: 5%;
            text-align: center;
        }
        
        .swatch-color {
            width: 100%;
            height: 40px;
            border-radius: 8px;
            border: 1px solid #CCC;
        }
        
        .swatch-label {
            font-size: 9pt;
            color: #555;
            margin-top: 8px;
            font-weight: bold;
        }
        
        /* Card Filosofi (Pastel) */
        .philosophy-card {
            background-color: #FDFBF7; /* Krem Muda */
            border-left: 6px solid #D4A017;
            padding: 25px;
            border-radius: 0 12px 12px 0;
            margin-top: 30px;
        }
        
        .philosophy-card p {
            margin: 0;
            font-size: 12pt;
            line-height: 1.6;
            color: #333;
        }
        
        .quote-icon {
            font-size: 20pt;
            color: #D4A017;
            margin-bottom: 10px;
        }
        
    </style>
</head>
<body>
    <div class="header">
        <h1>Laporan Analisis Batik Aceh AI</h1>
        <p>Dicetak pada: {{ timestamp }}</p>
    </div>
    
    <div class="content">
        <div class="row">
            <div class="img-card">
                <img src="{{ image_path }}" />
            </div>
            
            <div class="result-card">
                <p class="result-title">Hasil Prediksi Motif</p>
                <h2 class="result-motif">{{ motif_name }}</h2>
                
                <p class="progress-label">Confidence Score: {{ confidence }}%</p>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill"></div>
                </div>
                
                <div class="status-badge">
                    {{ status_icon }} {{ status_text }}
                </div>
            </div>
            <div class="clear"></div>
        </div>
        
        <div class="section-title">Palet Warna Dominan</div>
        <div class="swatch-container">
            {% for color in hex_colors %}
            <div class="swatch-box">
                <div class="swatch-color" style="background-color: {{ color }};"></div>
                <div class="swatch-label">{{ color }}</div>
            </div>
            {% endfor %}
            <div class="clear"></div>
        </div>
        
        <div class="section-title">Filosofi Motif</div>
        <div class="philosophy-card">
            <div class="quote-icon">&#10077;</div>
            <p><i>{{ philosophy }}</i></p>
        </div>
    </div>
</body>
</html>
